name: Export CrayCare snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create repository snapshot
        run: |
          zip -qr CrayCare-main.zip . -x '.git/*' 'CrayCare-main.zip'
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: craycare-main-snapshot
          path: CrayCare-main.zip
          retention-days: 1
