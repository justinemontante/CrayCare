            required String actuatorId, // 'pump', 'aerator1', or 'aerator2'
            required String mode,     // 'on' | 'off' | 'auto'
            required String actuatorName,
            required String modeLabel,
          }) async {""",
              """  Future<void> saveActuatorMode({
            required String actuatorId, // 'pump', 'aerator1', or 'aerator2'
            required String mode, // 'on' | 'off' | 'auto'
          }) async {""",
          )
          replace_once(
