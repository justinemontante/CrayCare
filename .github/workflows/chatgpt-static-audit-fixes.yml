name: ChatGPT Static Audit Fixes

on:
  push:
    branches:
      - chatgpt/static-audit-fixes-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded fixes
        shell: bash
        run: |
          cat > /tmp/apply_fixes.py <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 exact match, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))
              print("patched", path)

          def regex_once(path, pattern, repl, flags=0):
              text = read(path)
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 regex match, found {count}: {pattern[:80]!r}")
              write(path, new)
              print("patched", path)

          # Physical actuator logs belong to ESP confirmation, not Flutter request.
          replace_once(
