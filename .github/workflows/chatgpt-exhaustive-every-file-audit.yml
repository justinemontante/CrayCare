name: ChatGPT Exhaustive Every-File Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve audit runner
        shell: bash
        run: cp tools/exhaustive_every_file_audit.py /tmp/exhaustive_every_file_audit.py

      - name: Checkout exact current main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "AUDITED_COMMIT=$(git rev-parse HEAD)"

      - name: Install structured-file parser
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Audit every tracked file
        shell: bash
        run: python /tmp/exhaustive_every_file_audit.py

      - name: Show summary
        if: always()
        shell: bash
        run: |
          cat audit_every_file_output/summary.md || true
          echo "--- first 80 file rows ---"
          head -n 81 audit_every_file_output/files.tsv || true

      - name: Upload exhaustive audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-every-file-audit
          path: audit_every_file_output/
          if-no-files-found: error
