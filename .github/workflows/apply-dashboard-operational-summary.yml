name: Apply dashboard operational schedule summary

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-operational-summary.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add feeding period summary
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/screens/dashboard_screen.dart")
          text = path.read_text(encoding="utf-8")

          old_call = "                  _buildFeedingScheduleCard(),"
          new_call = """                  _buildSchedulePeriodSummary(),
                  const SizedBox(height: 8),
                  _buildFeedingScheduleCard(),"""
          if old_call not in text:
              raise SystemExit("Expected dashboard schedule call not found")
          text = text.replace(old_call, new_call, 1)

          marker = "  Widget _buildFeedingScheduleCard() {"
          helper = '''  Widget _buildSchedulePeriodSummary() {
            final now = _manilaNow();
            final todaySchedules = FeedState.schedules.value
                .where((schedule) => feederScheduleRunsOnDate(schedule, now))
                .toList();

            int countBetween(int startMinute, int endMinute) {
              return todaySchedules.where((schedule) {
                final minutes = feederScheduleMinutes(schedule);
                return minutes >= startMinute && minutes < endMinute;
              }).length;
            }

            final morningCount = countBetween(0, 12 * 60);
            final afternoonCount = countBetween(12 * 60, 18 * 60);
            final eveningCount = countBetween(18 * 60, 24 * 60);
            final totalCount = todaySchedules.length;
            final totalLabel = totalCount == 1 ? '1 feed' : '$totalCount feeds';

            return Container(
              margin: const EdgeInsets.fromLTRB(14, 4, 14, 0),
              padding: const EdgeInsets.fromLTRB(14, 12, 14, 12),
              decoration: BoxDecoration(
                color: Colors.white,
                borderRadius: BorderRadius.circular(16),
                border: Border.all(color: AppColors.darkWith(0.08)),
                boxShadow: AppShadows.card,
              ),
              child: Column(
                children: [
                  Row(
                    children: [
                      Container(
                        width: 34,
                        height: 34,
                        decoration: BoxDecoration(
                          color: AppColors.primary.withValues(alpha: 0.10),
                          borderRadius: BorderRadius.circular(10),
                        ),
                        child: const Icon(
                          Icons.today_rounded,
                          size: 18,
                          color: AppColors.primary,
                        ),
                      ),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              "Today's Feeding Plan",
                              style: TextStyle(
                                fontSize: 12,
                                fontWeight: FontWeight.w700,
                                color: AppColors.dark,
                              ),
                            ),
                            const SizedBox(height: 2),
                            Text(
                              'Active schedules grouped by time of day',
                              style: TextStyle(
                                fontSize: 9,
                                fontWeight: FontWeight.w500,
                                color: AppColors.darkWith(0.5),
                              ),
                            ),
                          ],
                        ),
                      ),
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 5),
                        decoration: BoxDecoration(
                          color: AppColors.primary.withValues(alpha: 0.10),
                          borderRadius: BorderRadius.circular(20),
                        ),
                        child: Text(
                          totalLabel,
                          style: const TextStyle(
                            fontSize: 9,
                            fontWeight: FontWeight.w700,
                            color: AppColors.primary,
                          ),
                        ),
                      ),
                    ],
                  ),
                  const SizedBox(height: 12),
                  Row(
                    children: [
                      _buildSchedulePeriodStat(
                        label: 'Morning',
                        detail: 'Before 12 PM',
                        count: morningCount,
                        icon: Icons.wb_sunny_outlined,
                        color: const Color(0xFFF59E0B),
                      ),
                      const SizedBox(width: 8),
                      _buildSchedulePeriodStat(
                        label: 'Afternoon',
                        detail: '12-6 PM',
                        count: afternoonCount,
                        icon: Icons.light_mode_outlined,
                        color: AppColors.primary,
                      ),
                      const SizedBox(width: 8),
                      _buildSchedulePeriodStat(
                        label: 'Evening',
                        detail: 'After 6 PM',
                        count: eveningCount,
                        icon: Icons.nights_stay_outlined,
                        color: const Color(0xFF6366F1),
                      ),
                    ],
                  ),
                ],
              ),
            );
          }

          Widget _buildSchedulePeriodStat({
            required String label,
            required String detail,
            required int count,
            required IconData icon,
            required Color color,
          }) {
            return Expanded(
              child: Container(
                padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 10),
                decoration: BoxDecoration(
                  color: color.withValues(alpha: 0.08),
                  borderRadius: BorderRadius.circular(12),
                  border: Border.all(color: color.withValues(alpha: 0.14)),
                ),
                child: Column(
                  children: [
                    Icon(icon, size: 17, color: color),
                    const SizedBox(height: 4),
                    Text(
                      '$count',
                      style: const TextStyle(
                        fontSize: 17,
                        fontWeight: FontWeight.w800,
                        color: AppColors.dark,
                      ),
                    ),
                    Text(
                      label,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 9,
                        fontWeight: FontWeight.w700,
                        color: AppColors.dark,
                      ),
                    ),
                    const SizedBox(height: 1),
                    Text(
                      detail,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: TextStyle(
                        fontSize: 7,
                        fontWeight: FontWeight.w500,
                        color: AppColors.darkWith(0.45),
                      ),
                    ),
                  ],
                ),
              ),
            );
          }

'''
          if marker not in text:
              raise SystemExit("Feeding schedule method marker not found")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/dashboard_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve dashboard operational schedule summary"
          git push origin HEAD:main
