name: Fix empty tank batch id

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix-empty-batch-id:
    if: github.event.issue.title == 'Apply empty batch id fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch TankService empty batch handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/services/tank_service.dart')
          text = path.read_text(encoding='utf-8')

          old_load = "      _selectedBatchId = data['current_batch_id'] as String?;"
          new_load = """      final rawBatchId = data['current_batch_id'] as String?;
      _selectedBatchId = rawBatchId == null || rawBatchId.trim().isEmpty
          ? null
          : rawBatchId.trim();"""

          old_subscribe = """    if (_selectedBatchId == null) return;

    final batchId = _selectedBatchId!;"""
          new_subscribe = """    final batchId = _selectedBatchId?.trim();
    if (batchId == null || batchId.isEmpty) return;"""

          if old_load not in text:
              raise SystemExit('Expected current_batch_id load line not found')
          if old_subscribe not in text:
              raise SystemExit('Expected resubscribe guard not found')

          text = text.replace(old_load, new_load, 1)
          text = text.replace(old_subscribe, new_subscribe, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit TankService fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/tank_service.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix empty batch id crash in TankService"
          git push origin HEAD:main
