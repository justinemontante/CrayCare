name: Refine View Feeding button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-view-feeding-button.yml'

permissions:
  contents: write

jobs:
  refine-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refine View Feeding action styling
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/dashboard_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = '''              GestureDetector(
                onTap: () => widget.onControlTab?.call(0),
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                  decoration: BoxDecoration(
                    color: AppColors.primary.withValues(alpha: 0.1),
                    borderRadius: BorderRadius.circular(8),
                  ),
                  child: const Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text(
                        'View Feeding',
                        style: TextStyle(
                          fontSize: 9,
                          fontWeight: FontWeight.w700,
                          color: AppColors.primary,
                        ),
                      ),
                      SizedBox(width: 2),
                      Icon(
                        Icons.chevron_right,
                        size: 10,
                        color: AppColors.primary,
                      ),
                    ],
                  ),
                ),
              ),'''

          new = '''              GestureDetector(
                behavior: HitTestBehavior.opaque,
                onTap: () => widget.onControlTab?.call(0),
                child: const Padding(
                  padding: EdgeInsets.symmetric(horizontal: 2, vertical: 6),
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text(
                        'View Feeding',
                        style: TextStyle(
                          fontSize: 10,
                          fontWeight: FontWeight.w600,
                          color: AppColors.primary,
                        ),
                      ),
                      SizedBox(width: 3),
                      Icon(
                        Icons.arrow_forward_ios_rounded,
                        size: 9,
                        color: AppColors.primary,
                      ),
                    ],
                  ),
                ),
              ),'''

          if old not in text:
              raise SystemExit('Expected View Feeding button block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit refined button
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/dashboard_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Refine dashboard feeding action styling"
          git push origin HEAD:main
