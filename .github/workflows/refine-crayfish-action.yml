name: Refine crayfish information action

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-crayfish-action.yml'

permissions:
  contents: write

jobs:
  refine-crayfish-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Match crayfish action to feeding action style
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/dashboard_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = '''                GestureDetector(
                  onTap: () {
                    if (batch != null) {
                      tank.selectBatch(batch.batchId);
                    }
                    widget.onTankTab?.call(0);
                  },
                  child: Container(
                    padding: const EdgeInsets.symmetric(
                      horizontal: 8,
                      vertical: 4,
                    ),
                    decoration: BoxDecoration(
                      color: AppColors.primary.withValues(alpha: 0.1),
                      borderRadius: BorderRadius.circular(8),
                    ),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text(
                          hasActive
                              ? 'Manage'
                              : (hasBatch ? 'View' : 'Initialize'),
                          style: const TextStyle(
                            fontSize: 9,
                            fontWeight: FontWeight.w700,
                            color: AppColors.primary,
                          ),
                        ),
                        const SizedBox(width: 2),
                        const Icon(
                          Icons.chevron_right,
                          size: 10,
                          color: AppColors.primary,
                        ),
                      ],
                    ),
                  ),
                ),'''

          new = '''                GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTap: () {
                    if (batch != null) {
                      tank.selectBatch(batch.batchId);
                    }
                    widget.onTankTab?.call(0);
                  },
                  child: Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 2, vertical: 6),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text(
                          hasActive
                              ? 'Manage'
                              : (hasBatch ? 'View' : 'Initialize'),
                          style: const TextStyle(
                            fontSize: 10,
                            fontWeight: FontWeight.w600,
                            color: AppColors.primary,
                          ),
                        ),
                        const SizedBox(width: 3),
                        const Icon(
                          Icons.arrow_forward_ios_rounded,
                          size: 9,
                          color: AppColors.primary,
                        ),
                      ],
                    ),
                  ),
                ),'''

          if old not in text:
              raise SystemExit('Expected crayfish action block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit refined crayfish action
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/dashboard_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Match crayfish dashboard action styling"
          git push origin HEAD:main

# trigger
