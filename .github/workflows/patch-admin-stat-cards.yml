name: Patch admin stat cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-stat-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Admin stat cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/admin_screen.dart')
          text = path.read_text()

          start = text.index('  Widget _buildStatsBar() {')
          end = text.index('  Widget _buildUserCard(', start)

          replacement = r'''  Widget _buildStatsBar() {
    final totalUsers = _users.length;
    final ownerUsers = _users
        .where((u) => (u['role'] as String? ?? 'owner') == 'owner')
        .length;
    final adminUsers = _users
        .where((u) => (u['role'] as String? ?? 'owner') == 'admin')
        .length;
    final disabledUsers = _users
        .where((u) => (u['status'] ?? 'active') == 'disabled')
        .length;

    return Padding(
      padding: const EdgeInsets.fromLTRB(14, 4, 14, 10),
      child: LayoutBuilder(
        builder: (context, constraints) {
          final cardWidth = (constraints.maxWidth - 10) / 2;
          return Wrap(
            spacing: 10,
            runSpacing: 10,
            children: [
              SizedBox(
                width: cardWidth,
                child: _buildStatCard(
                  value: '$totalUsers',
                  label: 'Total Users',
                  icon: Icons.groups_rounded,
                  iconColor: AppColors.primary,
                  iconBackground: AppColors.primary.withValues(alpha: 0.10),
                ),
              ),
              SizedBox(
                width: cardWidth,
                child: _buildStatCard(
                  value: '$ownerUsers',
                  label: 'Owners',
                  icon: Icons.person_rounded,
                  iconColor: AppColors.success,
                  iconBackground: AppColors.success.withValues(alpha: 0.10),
                ),
              ),
              SizedBox(
                width: cardWidth,
                child: _buildStatCard(
                  value: '$adminUsers',
                  label: 'Admins',
                  icon: Icons.verified_user_rounded,
                  iconColor: AppColors.dark,
                  iconBackground: AppColors.dark.withValues(alpha: 0.07),
                ),
              ),
              SizedBox(
                width: cardWidth,
                child: _buildStatCard(
                  value: '$disabledUsers',
                  label: 'Disabled',
                  icon: Icons.person_off_rounded,
                  iconColor: AppColors.critical,
                  iconBackground: AppColors.critical.withValues(alpha: 0.09),
                ),
              ),
            ],
          );
        },
      ),
    );
  }

  Widget _buildStatCard({
    required String value,
    required String label,
    required IconData icon,
    required Color iconColor,
    required Color iconBackground,
  }) {
    return Container(
      padding: const EdgeInsets.all(14),
      decoration: BoxDecoration(
        color: Colors.white,
        borderRadius: BorderRadius.circular(16),
        border: Border.all(color: AppColors.darkWith(0.08)),
      ),
      child: Row(
        children: [
          Container(
            width: 40,
            height: 40,
            decoration: BoxDecoration(
              color: iconBackground,
              borderRadius: BorderRadius.circular(12),
            ),
            child: Icon(icon, size: 20, color: iconColor),
          ),
          const SizedBox(width: 12),
          Expanded(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              mainAxisSize: MainAxisSize.min,
              children: [
                Text(
                  value,
                  style: const TextStyle(
                    fontSize: 21,
                    fontWeight: FontWeight.w800,
                    color: AppColors.darkText,
                    height: 1,
                  ),
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                ),
                const SizedBox(height: 5),
                Text(
                  label,
                  style: TextStyle(
                    fontSize: 10.5,
                    fontWeight: FontWeight.w600,
                    color: AppColors.darkWith(0.48),
                  ),
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/admin_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Match admin stat cards to tank overview style"
          git push origin main
