name: ChatGPT Fix Feeder Controls

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve guarded patcher
        shell: bash
        run: cp tools/fix_feeder_controls.py /tmp/fix_feeder_controls.py

      - name: Checkout exact current main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "4f6ebb37edbe0d1fb335a26062d1eb335010e456"

      - name: Apply feeder controls fix
        shell: bash
        run: python /tmp/fix_feeder_controls.py

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "lib/widgets/controls/feeder_tab.dart"
          grep -q "Schedules Paused" lib/widgets/controls/feeder_tab.dart
          grep -q "Select at least one day" lib/widgets/controls/feeder_tab.dart

      - name: Commit and push main
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/controls/feeder_tab.dart
          git commit -m "Fix feeder schedule status and day validation"
          git push origin HEAD:main
